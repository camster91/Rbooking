<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>AV Bookings Admin - Rotman AV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --rotman-blue: #00355f;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #10b981;
            /* Darker green for buttons: white text needs 4.5:1 contrast */
            --success-strong: #047857;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; }
        html { background: #0f172a; }
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: radial-gradient(circle at top left, #1e293b, #0f172a) fixed; color: var(--text); min-height: 100vh; padding: 20px; }
        a { color: #93c5fd; }
        .wrap { max-width: 1000px; margin: 0 auto; }

        header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: linear-gradient(135deg, var(--rotman-blue) 0%, #001f3f 100%); padding: 22px 28px; border-radius: 20px; border: 1px solid var(--border); }
        header h1 { margin: 0; font-size: 1.4rem; font-weight: 800; }
        header p { margin: 4px 0 0; opacity: 0.8; font-size: 0.9rem; }
        .header-link { color: white; text-decoration: none; font-weight: 600; font-size: 0.9rem; background: rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 10px; }
        .header-link:hover { background: rgba(255,255,255,0.18); }

        .toolbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: 20px 0; }
        .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
        .tab { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 999px; font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .tab:hover { color: white; }
        .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: white; }
        .tab .count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: rgba(255,255,255,0.2); font-size: 0.75rem; }
        .search { flex: 1; min-width: 200px; max-width: 320px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; color: white; font: inherit; }
        .search:focus, .tab:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .list { display: flex; flex-direction: column; gap: 12px; }
        .booking { display: grid; grid-template-columns: 72px 1fr auto; gap: 18px; align-items: start; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; scroll-margin-top: 20px; }
        .booking.highlight { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3); }
        .date { text-align: center; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px 4px; }
        .date .dow { font-size: 0.7rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.05em; }
        .date .day { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
        .date .mon { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
        .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .title-row h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
        .ref { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
        .badge { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 999px; }
        .badge.pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .badge.approved { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge.declined, .badge.cancelled { background: rgba(148, 163, 184, 0.15); color: var(--muted); }
        .meta { margin: 6px 0 0; color: #cbd5e1; font-size: 0.92rem; line-height: 1.6; }
        .meta span { white-space: nowrap; }
        .meta .sep { color: var(--muted); margin: 0 6px; }
        details { margin-top: 8px; font-size: 0.9rem; }
        summary { cursor: pointer; color: var(--muted); font-weight: 600; }
        dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 10px 0 0; }
        dt { color: var(--muted); }
        dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
        .conflict { margin-top: 10px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35); color: #fcd34d; padding: 8px 12px; border-radius: 10px; font-size: 0.88rem; }
        .conflict a { color: #fde68a; }
        .conflict.hard { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }
        .conflict.hard a { color: #fecaca; }
        .note { margin-top: 8px; color: var(--muted); font-size: 0.88rem; font-style: italic; }

        .actions { display: flex; flex-direction: column; gap: 8px; min-width: 110px; }
        .btn { border: none; border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 0.88rem; font-weight: 700; cursor: pointer; color: white; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-approve { background: var(--success-strong); }
        .btn-approve:hover { background: #065f46; }
        .btn-decline { background: transparent; border: 1px solid rgba(239, 68, 68, 0.5); color: #fca5a5; }
        .btn-decline:hover { background: rgba(239, 68, 68, 0.1); }
        .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
        .btn-cancel:hover { color: white; background: rgba(255,255,255,0.05); }
        .btn-primary { background: var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); }

        .empty, .error { text-align: center; padding: 50px 20px; color: var(--muted); background: var(--card-bg); border: 1px dashed var(--border); border-radius: 16px; }
        .error { color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }

        dialog { background: #1e293b; color: var(--text); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: min(440px, calc(100vw - 32px)); }
        dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
        dialog h3 { margin: 0 0 6px; }
        dialog p { margin: 0 0 14px; color: var(--muted); font-size: 0.92rem; }
        dialog label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }
        dialog textarea { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: white; font: inherit; resize: vertical; }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
        .dialog-error { color: #fca5a5; font-size: 0.9rem; margin-top: 10px; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid var(--border); padding: 12px 18px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); font-weight: 600; max-width: calc(100vw - 32px); }

        @media (max-width: 640px) {
            body { padding: 16px; }
            header { padding: 18px 20px; }
            .booking { grid-template-columns: 56px 1fr; padding: 16px; gap: 14px; }
            .actions { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; }
            .actions .btn { flex: 1; }
            .search { max-width: none; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <header>
            <div>
                <h1>AV Bookings</h1>
                <p>Review, approve and cancel event requests</p>
            </div>
            <a class="header-link" href="./">Open booking form</a>
        </header>

        <div class="toolbar">
            <div class="tabs" role="tablist" aria-label="Which bookings">
                <button class="tab" role="tab" data-tab="review">Needs review<span class="count" id="review-count" hidden></span></button>
                <button class="tab" role="tab" data-tab="upcoming">Upcoming</button>
                <button class="tab" role="tab" data-tab="past">Past</button>
                <button class="tab" role="tab" data-tab="all">All</button>
            </div>
            <input class="search" id="search" type="search" placeholder="Search name, email, ref #" aria-label="Search bookings">
        </div>

        <div class="list" id="list" aria-live="polite"></div>
    </main>

    <dialog id="action-dialog">
        <form method="dialog" id="action-form">
            <h3 id="dialog-title"></h3>
            <p id="dialog-text"></p>
            <label for="dialog-note">Note to the requester (optional)</label>
            <textarea id="dialog-note" rows="3" maxlength="2000"></textarea>
            <div class="dialog-error" id="dialog-error" hidden></div>
            <div class="dialog-actions">
                <button type="button" class="btn btn-cancel" id="dialog-close">Back</button>
                <button type="submit" class="btn btn-primary" id="dialog-confirm"></button>
            </div>
        </form>
    </dialog>

    <script>
        const TABS = {
            review: { scope: 'upcoming', status: 'pending', empty: 'Nothing waiting for review.' },
            upcoming: { scope: 'upcoming', empty: 'No upcoming bookings.' },
            past: { scope: 'past', empty: 'No past bookings.' },
            all: { scope: 'all', empty: 'No bookings yet.' }
        };
        const ACTIONS = {
            approved: { verb: 'Approve', title: 'Approve booking', text: 'The requester gets a confirmation email with a calendar invite.', cls: 'btn-approve' },
            declined: { verb: 'Decline', title: 'Decline booking', text: 'The requester gets an email saying the booking was declined.', cls: 'btn-decline' },
            cancelled: { verb: 'Cancel', title: 'Cancel booking', text: 'The requester gets an email, and approved bookings are removed from their calendar.', cls: 'btn-cancel' }
        };
        // Pending requests are approved or declined; only approved ones get cancelled.
        const NEXT = { pending: ['approved', 'declined'], approved: ['cancelled'], declined: [], cancelled: [] };

        let currentTab = 'review';
        let bookings = [];
        const listEl = document.getElementById('list');
        const searchEl = document.getElementById('search');

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function formatTime(t) {
            const [h, m] = t.split(':').map(Number);
            return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
        }

        function dateParts(iso) {
            const d = new Date(iso + 'T12:00:00');
            return {
                dow: d.toLocaleDateString('en-US', { weekday: 'short' }),
                day: d.getDate(),
                mon: d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
                long: d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })
            };
        }

        function renderBooking(b) {
            const d = dateParts(b.eventDate);
            const details = [
                ['Registration', formatTime(b.registrationTime)],
                ['Event start', formatTime(b.startTime)],
                ['Presentation end', formatTime(b.endTime)],
                ['Shutdown', formatTime(b.shutdownTime)],
                ['Recording', b.recordingName],
                b.ccNumber && ['CC#', b.ccNumber],
                b.cfcNumber && ['CFC#', b.cfcNumber],
                b.notes && ['Notes', b.notes],
                ['Requested', new Date(b.createdAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })]
            ].filter(Boolean);
            const link = (c) => `<a href="#booking-${c.id}" data-jump="${c.id}">#${c.id} ${esc(c.eventName)}</a>`;
            // A pending request that clashes with an approved one can't be approved
            const blockedBy = b.status === 'pending' ? b.conflicts.filter(c => c.status === 'approved') : [];
            const conflicts = blockedBy.length
                ? `<div class="conflict hard">⛔ Clashes with approved ${blockedBy.map(link).join(', ')}. Cancel that booking first to approve this one.</div>`
                : b.conflicts.length
                    ? `<div class="conflict">⚠ Overlaps ${b.conflicts.map(c => `${link(c)} (${esc(c.status)})`).join(', ')}</div>`
                    : '';
            const actions = NEXT[b.status].map(s =>
                `<button class="btn ${ACTIONS[s].cls}" data-id="${b.id}" data-status="${s}"${s === 'approved' && blockedBy.length ? ' disabled title="Clashes with an approved booking"' : ''}>${ACTIONS[s].verb}</button>`).join('');

            return `<article class="booking" id="booking-${b.id}">
                <div class="date" title="${esc(d.long)}"><div class="dow">${esc(d.dow)}</div><div class="day">${d.day}</div><div class="mon">${esc(d.mon)}</div></div>
                <div>
                    <div class="title-row">
                        <h2>${esc(b.eventName)}</h2>
                        <span class="ref">#${b.id}</span>
                        <span class="badge ${esc(b.status)}">${esc(b.status)}</span>
                    </div>
                    <p class="meta">
                        <span>${esc(b.spaceName)}</span><span class="sep">·</span><span>${formatTime(b.registrationTime)} – ${formatTime(b.shutdownTime)}</span><br>
                        <span>${esc(b.contactName)}</span><span class="sep">·</span><a href="mailto:${esc(b.contactEmail)}">${esc(b.contactEmail)}</a>
                        ${b.uploadUrl ? `<span class="sep">·</span><a href="${esc(b.uploadUrl)}" target="_blank" rel="noopener">Attached file</a>` : ''}
                    </p>
                    ${conflicts}
                    ${b.statusNote ? `<div class="note">Note: ${esc(b.statusNote)}</div>` : ''}
                    <details>
                        <summary>Details</summary>
                        <dl>${details.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
                    </details>
                </div>
                <div class="actions">${actions}</div>
            </article>`;
        }

        function render() {
            const q = searchEl.value.trim().toLowerCase().replace(/^#/, '');
            const shown = q
                ? bookings.filter(b => [b.id, b.eventName, b.contactName, b.contactEmail, b.spaceName].join(' ').toLowerCase().includes(q))
                : bookings;
            listEl.innerHTML = shown.length
                ? shown.map(renderBooking).join('')
                : `<div class="empty">${q ? 'No bookings match your search.' : TABS[currentTab].empty}</div>`;
        }

        // Bumped on every load so a slow reply for an earlier tab can't
        // replace the list for the tab now selected.
        let loadRequest = 0;

        async function load(tab, focusId) {
            const requestId = ++loadRequest;
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
            const { scope, status } = TABS[tab];
            listEl.innerHTML = '<div class="empty">Loading…</div>';
            try {
                const res = await fetch(`api/admin/bookings?scope=${scope}${status ? `&status=${status}` : ''}`, { cache: 'no-store' });
                if (!res.ok) throw new Error(`Server returned ${res.status}`);
                const data = await res.json();
                if (requestId !== loadRequest) return;
                bookings = data.bookings;
                // A linked booking may be outside this list (e.g. older ones): fetch it on its own.
                if (focusId && !bookings.some(b => b.id === focusId)) {
                    const one = await fetch(`api/admin/bookings/${focusId}`, { cache: 'no-store' });
                    if (one.ok && requestId === loadRequest) bookings = [(await one.json()).booking, ...bookings];
                }
                if (requestId !== loadRequest) return;
                render();
                showReviewCount(data.pendingCount);
                if (focusId) highlight(focusId);
            } catch (err) {
                if (requestId !== loadRequest) return;
                listEl.innerHTML = `<div class="error">Could not load bookings (${esc(err.message)}). Refresh to try again.</div>`;
            }
        }

        function showReviewCount(n) {
            const el = document.getElementById('review-count');
            el.textContent = n;
            el.hidden = !n;
        }

        function highlight(id) {
            const el = document.getElementById(`booking-${id}`);
            if (!el) return false;
            document.querySelectorAll('.booking.highlight').forEach(e => e.classList.remove('highlight'));
            el.classList.add('highlight');
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            return true;
        }

        function toast(message) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.setAttribute('role', 'status');
            t.textContent = message;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // Status change dialog
        const dialog = document.getElementById('action-dialog');
        const noteEl = document.getElementById('dialog-note');
        const dialogError = document.getElementById('dialog-error');
        const confirmBtn = document.getElementById('dialog-confirm');
        let pending = null;

        function openDialog(id, status) {
            const b = bookings.find(x => x.id === id);
            const a = ACTIONS[status];
            pending = { id, status };
            document.getElementById('dialog-title').textContent = `${a.title} #${id}`;
            document.getElementById('dialog-text').textContent = `${b ? b.eventName + ' — ' : ''}${a.text}`;
            confirmBtn.textContent = a.verb;
            confirmBtn.className = `btn ${status === 'approved' ? 'btn-approve' : 'btn-primary'}`;
            noteEl.value = '';
            dialogError.hidden = true;
            dialog.showModal();
            noteEl.focus();
        }

        document.getElementById('dialog-close').addEventListener('click', () => dialog.close());

        document.getElementById('action-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!pending) return;
            confirmBtn.disabled = true;
            dialogError.hidden = true;
            try {
                const res = await fetch(`api/admin/bookings/${pending.id}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: pending.status, note: noteEl.value })
                });
                const result = await res.json().catch(() => ({}));
                if (!res.ok || !result.success) throw new Error(result.message || `Server returned ${res.status}`);
                dialog.close();
                toast(`#${pending.id} ${pending.status}.${result.requesterNotified ? ' The requester has been emailed.' : ' Email to the requester failed - please contact them.'}`);
                load(currentTab);
            } catch (err) {
                dialogError.textContent = err.message;
                dialogError.hidden = false;
            } finally {
                confirmBtn.disabled = false;
            }
        });

        listEl.addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-status]');
            if (btn) return openDialog(Number(btn.dataset.id), btn.dataset.status);
            const jump = e.target.closest('[data-jump]');
            if (jump) {
                e.preventDefault();
                const id = Number(jump.dataset.jump);
                if (!highlight(id)) load('all', id);
            }
        });

        document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => load(t.dataset.tab)));
        searchEl.addEventListener('input', render);

        // Links from staff emails point at #booking-<id>: show all so it's found.
        const linked = Number((location.hash.match(/^#booking-(\d+)$/) || [])[1]);
        load(linked ? 'all' : 'review', linked || undefined);
    </script>
</body>
</html>
