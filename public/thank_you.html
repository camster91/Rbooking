<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Rotman AV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@1.50.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --rotman-blue: #00355f;
            --accent: #2563eb;
            --success: #10b981;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top left, #1e293b, #0f172a); 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .thank-you-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 60px 50px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .success-icon {
            width: 100px;
            height: 100px;
            background: rgba(16, 185, 129, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }
        .success-icon svg { color: var(--success); width: 50px; height: 50px; }
        h1 { font-weight: 800; margin-bottom: 15px; }
        p { color: var(--muted); font-size: 1.1rem; margin-bottom: 30px; }
        .btn-home {
            background: var(--accent);
            color: white;
            padding: 14px 35px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-home:hover { background: #1d4ed8; color: white; }
    </style>
</head>
<body>
    <main class="thank-you-card">
        <div class="success-icon">
            <i data-lucide="circle-check"></i>
        </div>
        <h1>Booking Submitted!</h1>
        <p>Thank you for your booking request. It isn't confirmed yet - you'll get an email once the AV team reviews it.</p>
        <a href="./" class="btn-home">Submit Another Booking</a>
    </main>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
